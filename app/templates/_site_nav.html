{% macro site_nav(active, library_urls=none) %}
  {% from '_icons.html' import icon %}
  <header class="site-header">
    <div class="site-header-inner">
      <a class="site-brand" href="/">{{ settings.site_title }}</a>
      <nav class="site-navigation" aria-label="主导航">
        <a href="/" {% if active == 'home' %}aria-current="page"{% endif %}>首页</a>
        {% for view, label in [('timeline', '时间线'), ('folders', '文件夹'), ('calendar', '日历'), ('favorites', '收藏')] %}
          <a href="{{ library_urls[view] if library_urls else ('/library' if view == 'timeline' else '/library?view=' ~ view) }}" {% if active == view or (active == 'library' and view == 'timeline') %}aria-current="page"{% endif %}>{{ label }}</a>
        {% endfor %}
      </nav>
      <div class="site-header-actions">
        <button class="intranet-jump-button{% if settings.intranet_keepalive_enabled and settings.intranet_redirect_host %} is-visible{% endif %}" type="button" data-intranet-jump aria-live="polite" {% if not settings.intranet_keepalive_enabled or not settings.intranet_redirect_host %}hidden{% endif %}>检测内网</button>
        <a class="site-settings" href="/settings" {% if active == 'settings' %}aria-current="page"{% endif %} aria-label="设置" title="设置">{{ icon('settings') }}<span>设置</span></a>
      </div>
    </div>
  </header>
{% endmacro %}
