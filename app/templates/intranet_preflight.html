{% with preflight_loading=true %}{% include '_document_start.html' %}{% endwith %}
    <title>正在载入 - {{ settings.site_title }}</title>
  </head>
  <body
    data-intranet-preflight="1"
    data-intranet-enabled="1"
    data-intranet-auto-redirect-enabled="1"
    data-intranet-redirect-host="{{ settings.intranet_redirect_host }}"
    data-intranet-redirect-port="{{ settings.intranet_redirect_port }}"
    data-intranet-redirect-protocol="{{ settings.intranet_redirect_protocol }}"
  >
    <a class="loading-fallback" href="{{ fallback_url }}">继续访问当前地址</a>
    <style>.loading-fallback { position:fixed; bottom:28px; left:50%; transform:translateX(-50%); z-index:10001; font:13px system-ui; color:#56657b; text-decoration:none; padding:12px 18px; border-radius:24px; background:rgba(255,255,255,.65); }</style>
    <script src="/static/intranet.js?v=2.6.9"></script>
  </body>
</html>
