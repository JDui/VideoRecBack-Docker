<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{{ settings.site_title if settings else "视频归档" }}{% endblock %}</title>
    {% if request.query_params.get('_vbr_skip_intranet') == '1' %}
    <script>
      const pageUrl = new URL(window.location.href);
      pageUrl.searchParams.delete("_vbr_skip_intranet");
      window.history.replaceState(window.history.state, "", pageUrl.toString());
    </script>
    {% endif %}
    <link rel="stylesheet" href="/static/styles.css?v=2.6.6">
    {% block head %}{% endblock %}
    <link rel="stylesheet" href="/static/liquid-glass.css?v=4">
  </head>
  <body
    class="{% block body_class %}{% endblock %}"
    data-intranet-enabled="{{ '1' if settings and settings.intranet_keepalive_enabled else '0' }}"
    data-intranet-auto-redirect-enabled="{{ '1' if settings and settings.intranet_auto_redirect_enabled else '0' }}"
    data-intranet-redirect-host="{{ settings.intranet_redirect_host if settings else '' }}"
    data-intranet-redirect-port="{{ settings.intranet_redirect_port if settings else '' }}"
    data-intranet-redirect-protocol="{{ settings.intranet_redirect_protocol if settings else 'http' }}"
  >
    <div class="ambient-background" aria-hidden="true"></div>
    {% block chrome %}
      <header class="topbar">
        <a class="brand" href="/">{{ settings.site_title if settings else "视频归档" }}</a>
        <nav class="nav">
          <a class="nav-link" href="/">首页</a>
          <a class="nav-link" href="/library">视频库</a>
          <form action="/scan" method="post">
            <button class="nav-button" type="submit">扫描</button>
          </form>
          <a class="nav-button secondary" href="/settings">设置</a>
        </nav>
      </header>
    {% endblock %}
    <main class="page">
      {% block content %}{% endblock %}
    </main>
    <script src="/static/intranet.js?v=2.6.9" defer></script>
    {% block scripts %}{% endblock %}
    <script src="/static/liquid-glass.js?v=4" defer></script>
  </body>
</html>
