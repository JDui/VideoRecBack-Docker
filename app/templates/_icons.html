{% macro icon(name) -%}
<svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
  {% if name == 'back' %}<path d="m15 5-7 7 7 7"/>
  {% elif name == 'close' %}<path d="m6 6 12 12M6 18 18 6"/>
  {% elif name == 'heart' %}<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z"/>
  {% elif name == 'settings' %}<path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="3" fill="var(--panel)"/><circle cx="15" cy="17" r="3" fill="var(--panel)"/>
  {% elif name == 'volume' %}<path d="m11 4-6 5H2v6h3l6 5V4ZM15 8a6 6 0 0 1 0 8M18 5a10 10 0 0 1 0 14"/>
  {% elif name == 'fullscreen' %}<path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/>
  {% elif name == 'download' %}<path d="M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5"/>
  {% elif name == 'rewind' %}<path d="M3 9a9 9 0 1 1 1 9M3 4v5h5"/><text x="7" y="16" stroke="none" fill="currentColor" font-size="9" font-weight="600">10</text>
  {% elif name == 'forward' %}<path d="M21 9a9 9 0 1 0-1 9m1-14v5h-5"/><text x="7" y="16" stroke="none" fill="currentColor" font-size="9" font-weight="600">10</text>
  {% endif %}
</svg>
{%- endmacro %}
